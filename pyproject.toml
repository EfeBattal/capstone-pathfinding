[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "walle-planner"
version = "0.1.0"
description = "Path planning and optimization for the Wall-E litter-collecting robot (ECE 4600 G13)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.60",
    "PyYAML>=6.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/walle_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"